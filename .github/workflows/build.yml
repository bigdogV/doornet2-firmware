name: DoorNet2 firmware
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl ca-certificates time subversion patch cmake ninja-build libelf-dev device-tree-compiler cpio genisoimage qemu-utils help2man libtool-bin autoconf automake autopoint gperf texinfo uglifyjs antlr3 asciidoc libfuse-dev
      - name: Clone sources
        run: git clone --depth 1 --branch stable https://github.com/DHDAXCW/lede-rockchip.git openwrt
      - name: Update plugin sources
        working-directory: openwrt
        run: |
          set -euxo pipefail
          sed -i '/^[[:space:]]*src-git[[:space:]]\+telephony[[:space:]]/d' feeds.conf.default
          ./scripts/feeds update -a
          for name in luci-app-passwall luci-app-passwall2; do
            while IFS= read -r path; do rm -rf -- "$path"; done < <(find package feeds -type d -name "$name" -prune)
          done
          printf '%s\n' 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' >> feeds.conf.default
          ./scripts/feeds update passwall_packages passwall_luci
          ./scripts/feeds install -a
          ./scripts/feeds install -f -a -p passwall_packages
          ./scripts/feeds install -f -p passwall_luci luci-app-passwall
      - name: Add official QuickStart homepage
        working-directory: openwrt
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/linkease/nas-packages-luci.git quickstart-ui
          git -C quickstart-ui sparse-checkout set luci/luci-app-quickstart
          git clone --depth 1 --filter=blob:none --sparse https://github.com/linkease/nas-packages.git quickstart-backend
          git -C quickstart-backend sparse-checkout set network/services/quickstart
          mkdir -p package/custom build-metadata
          cp -a quickstart-ui/luci/luci-app-quickstart package/custom/
          cp -a quickstart-backend/network/services/quickstart package/custom/
          ./scripts/feeds install -f -p istore luci-app-store
          git -C quickstart-ui rev-parse HEAD > build-metadata/quickstart-ui-revision.txt
          git -C quickstart-backend rev-parse HEAD > build-metadata/quickstart-backend-revision.txt
      - name: Configure DoorNet2 and verify all requested plugins
        working-directory: openwrt
        run: |
          cat > .config <<'CONFIG'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_embedfire_doornet2=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=2048
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG
          for app in passwall firewall upnp arpbind cpufreq diskman ttyd turboacc sqm uugamebooster quickstart store; do
            echo "CONFIG_PACKAGE_luci-app-$app=y" >> .config
          done
          mkdir -p build-metadata
          cp .config build-metadata/requested.config
          make defconfig
          python3 - <<'PYCONFIG'
          from pathlib import Path
          import re
          allow=set('passwall firewall upnp arpbind cpufreq diskman ttyd turboacc sqm uugamebooster quickstart store'.split())
          blocked=set('autosamba docker dockerd docker-compose containerd runc cgroupfs-mount samba4-server samba4-client nfs-kernel-server nfs-kernel-server-utils minidlna aria2 transmission-daemon qbittorrent rclone vsftpd vsftpd-alt openvpn-openssl openvpn-mbedtls strongswan-full pptpd softethervpn5-server zerotier wireguard-tools'.split())
          lines=Path('.config').read_text().splitlines()
          result=[]
          for line in lines:
              m=re.match(r'CONFIG_PACKAGE_(.*?)=[ym]$',line)
              if m and ((m[1].startswith('luci-app-') and m[1][9:] not in allow) or m[1] in blocked):
                  line='# CONFIG_PACKAGE_'+m[1]+' is not set'
              result.append(line)
          for name in blocked:
              if not any('CONFIG_PACKAGE_'+name+' ' in x or x.startswith('CONFIG_PACKAGE_'+name+'=') for x in result):
                  result.append('# CONFIG_PACKAGE_'+name+' is not set')
          Path('.config').write_text(chr(10).join(result)+chr(10))
          PYCONFIG
          make defconfig
          cp .config build-metadata/resolved.config
          ./scripts/diffconfig.sh > build-metadata/diffconfig
          git rev-parse HEAD > build-metadata/source-revisions.txt
          for f in feeds/*; do
            if test -d "$f/.git"; then
              echo "$f $(git -C "$f" rev-parse HEAD)" >> build-metadata/source-revisions.txt
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          wanted=[x for x in Path('build-metadata/requested.config').read_text().splitlines() if x.startswith('CONFIG_PACKAGE_') and x.endswith('=y')]
          actual=set(Path('.config').read_text().splitlines())
          missing=[x for x in wanted if x not in actual]
          Path('build-metadata/unavailable-packages.txt').write_text(chr(10).join(missing)+chr(10))
          if missing:
              raise SystemExit('Unavailable packages: '+', '.join(missing))
          allowed=set('passwall firewall upnp arpbind cpufreq diskman ttyd turboacc sqm uugamebooster quickstart store'.split())
          unexpected=sorted(x for x in actual if x.startswith('CONFIG_PACKAGE_luci-app-') and x.endswith('=y') and x[len('CONFIG_PACKAGE_luci-app-'):-2] not in allowed)
          if unexpected:
              raise SystemExit('Unexpected plugins in slim image: '+', '.join(unexpected))
          forbidden=('dockerd','docker','docker-compose','containerd','runc','autosamba')
          if any('CONFIG_PACKAGE_'+x+'=y' in actual for x in forbidden):
              raise SystemExit('Unwanted Docker or sharing dependency selected')
          PY
      - name: Set LAN address and disable IPv6
        working-directory: openwrt
        run: |
          mkdir -p files/etc/uci-defaults files/etc/sysctl.d
          cat > files/etc/sysctl.d/99-disable-ipv6.conf <<'SYSCTL'
          net.ipv6.conf.all.disable_ipv6=1
          net.ipv6.conf.default.disable_ipv6=1
          net.ipv6.conf.all.forwarding=0
          SYSCTL
          cat > files/etc/uci-defaults/99-local-settings <<'UCI'
          #!/bin/sh
          uci set network.lan.ipaddr='192.168.11.1'
          uci -q delete network.lan.ip6assign
          uci -q delete network.globals.ula_prefix
          uci set network.wan.ipv6='0'
          uci set network.wan.delegate='0'
          uci -q delete network.wan6
          uci set dhcp.lan.ra='disabled'
          uci set dhcp.lan.dhcpv6='disabled'
          uci set dhcp.lan.ndp='disabled'
          uci set dhcp.lan.ra_slaac='0'
          uci -q delete dhcp.lan.ra_flags
          uci set dhcp.@dnsmasq[0].filter_aaaa='1'
          uci commit network
          uci commit dhcp
          /etc/init.d/odhcpd disable
          exit 0
          UCI
          chmod +x files/etc/uci-defaults/99-local-settings
      - name: Download
        working-directory: openwrt
        run: make download -j8
      - name: Build
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j2 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2-build-diagnostics
          path: |
            openwrt/build-metadata/
            openwrt/build.log
            openwrt/logs/
          retention-days: 14
      - name: Upload firmware and packages
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2-firmware
          path: |
            openwrt/bin/targets/rockchip/armv8/
            openwrt/bin/packages/
          retention-days: 14
